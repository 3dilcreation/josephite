<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Dil Creation — Order Admin</title>
  <style>
    :root {
      --gold: #c9a227;
      --dark: #1a1a2e;
      --mid: #16213e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; color: #333; min-height: 100vh; }
    header {
      background: linear-gradient(135deg, var(--dark), var(--mid));
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 20px; font-weight: 800; letter-spacing: 2px; color: var(--gold); }
    header span { font-size: 13px; color: #888; }
    .container { max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .card-header {
      background: var(--dark);
      color: white;
      padding: 18px 28px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header::before { content: '📋'; }
    form { padding: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color .2s;
      background: #fafafa;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
      background: white;
    }
    textarea { resize: vertical; min-height: 80px; }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--gold), #e8b830);
      color: var(--dark);
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 1px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    #result {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    #result.success { background: #e8f5e9; border-left: 4px solid #43a047; color: #2e7d32; }
    #result.error   { background: #ffebee; border-left: 4px solid #e53935; color: #c62828; }

    .sources { display: flex; gap: 10px; margin-bottom: 28px; }
    .src-badge {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      background: #f5f5f5;
      color: #888;
    }
    .src-badge.auto { background: #e8f5e9; color: #2e7d32; }
    .src-badge span { display: block; font-size: 20px; margin-bottom: 4px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>3DIL CREATION</h1>
    <span>Order Automation Admin</span>
  </div>
</header>

<div class="container">

  <div class="sources">
    <div class="src-badge auto"><span>🛍️</span>Shopify<br>Auto</div>
    <div class="src-badge auto"><span>💬</span>WhatsApp<br>Auto</div>
    <div class="src-badge auto"><span>📸</span>Instagram<br>Auto</div>
    <div class="src-badge"><span>📝</span>Manual<br>Form below</div>
  </div>

  <div class="card">
    <div class="card-header">New Manual Order Entry</div>
    <form id="orderForm">
      <div class="grid">
        <div>
          <label>Customer Name *</label>
          <input type="text" name="customerName" required placeholder="Full name">
        </div>
        <div>
          <label>Phone Number</label>
          <input type="tel" name="customerPhone" placeholder="+91 98765 43210">
        </div>
        <div>
          <label>Email Address</label>
          <input type="email" name="customerEmail" placeholder="customer@email.com">
        </div>
        <div>
          <label>Service Type *</label>
          <select name="serviceType" required>
            <option value="">— Select service —</option>
            <option value="360-tour">360° Virtual Tour</option>
            <option value="3d-modeling">3D Modeling</option>
            <option value="3d-printing">3D Printing</option>
            <option value="rendering">3D Rendering</option>
            <option value="virtual-staging">Virtual Staging</option>
            <option value="default">Other / Custom</option>
          </select>
        </div>
        <div>
          <label>Priority / Complexity</label>
          <select name="complexity">
            <option value="standard">Standard</option>
            <option value="rush">Rush (urgent)</option>
            <option value="complex">Complex / Large</option>
          </select>
        </div>
        <div>
          <label>Quote / Amount</label>
          <input type="text" name="amount" placeholder="e.g. ₹5,000 or TBD">
        </div>
        <div class="full">
          <label>Property / Job Address</label>
          <input type="text" name="address" placeholder="Site address (optional)">
        </div>
        <div class="full">
          <label>Requirements &amp; Notes</label>
          <textarea name="notes" placeholder="Describe the job requirements, special instructions, etc."></textarea>
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Create Order + Schedule Deadline</button>
      <div id="result"></div>
    </form>
  </div>

</div>

<script>
  document.getElementById('orderForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    btn.disabled = true;
    btn.textContent = 'Creating order…';
    result.style.display = 'none';

    const data = Object.fromEntries(new FormData(this));

    try {
      const res = await fetch('/webhooks/manual', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();

      if (res.ok && json.success) {
        result.className = 'success';
        result.textContent = '✅ Order created! Calendar event scheduled and job sheet sent.';
        this.reset();
      } else {
        throw new Error(json.error || 'Unknown error');
      }
    } catch (err) {
      result.className = 'error';
      result.textContent = '❌ Error: ' + err.message;
    } finally {
      result.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Order + Schedule Deadline';
    }
  });
</script>

</body>
</html>
